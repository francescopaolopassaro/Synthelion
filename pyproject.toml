[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthelion"
version = "1.2.5"
description = "Universal token compressor for AI agents — MCP, OpenAI, LangChain, CLI. 50+ languages, zero ML models."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Passaro Francesco Paolo", email = "passaroweb@gmail.com" }]
maintainers = [{ name = "digitalsolutions", email = "passaroweb@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "llm", "token", "compression", "prompt", "nlp",
    "mcp", "claude", "claude-code", "opencode",
    "openai", "langchain", "agent", "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "brotli>=1.1",
    "regex>=2024.1",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "sqlparse>=0.5",
    # worddata (per-language function-word/IDF/POS tables, needed by every
    # compress() call) ships from Hugging Face rather than inside the wheel
    # to keep the published package under PyPI's size limit — see
    # synthelion/_asset_download.py. Required, not optional: without it the
    # first compress() call has no local worddata to auto-fetch.
    "huggingface_hub>=0.20",
    # Windows-only: required to register/run the native Windows service
    # (`synthelion service install`). Installed automatically on Windows,
    # skipped on Linux/macOS.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/francescopaolopassaro/synthelion"
Repository = "https://github.com/francescopaolopassaro/synthelion"
"Bug Tracker" = "https://github.com/francescopaolopassaro/synthelion/issues"
"Original C# project" = "https://github.com/francescopaolopassaro/caveman"

[project.optional-dependencies]
openai = ["openai>=1.0"]
langchain = ["langchain-core>=0.1"]
claude = ["anthropic>=0.25"]
crewai = ["crewai>=1.15,<2"]
chromadb = ["chromadb>=0.4"]
qdrant = ["qdrant-client>=1.9"]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
cluster = ["redis>=5.0", "psycopg[binary]>=3.1", "qdrant-client>=1.9"]
documents = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1"]
enterprise = ["cryptography>=41.0", "keyring>=24.0"]
# ML tiers (SynthelionML compression, PrivacyGuardML privacy.use_ml) need only
# `torch` at runtime, loading their own bundled checkpoints — no third-party
# model, no download. NOT listed as a hard dependency on purpose: `pip install
# torch` is opt-in, so the package itself stays lightweight (zero ML in its
# default dependency tree).
all = [
    "openai>=1.0", "langchain-core>=0.1", "anthropic>=0.25", "crewai>=1.15,<2",
    "chromadb>=0.4", "qdrant-client>=1.9", "redis>=5.0", "psycopg[binary]>=3.1",
    "pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "cryptography>=41.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
synthelion = "synthelion.cli:main"
synthelion-mcp = "synthelion.plugins.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthelion*"]

[tool.setuptools.package-data]
# worddata/*.br and ml_models/ are deliberately NOT listed here — both moved
# to Hugging Face (digitalsolutiosai/synthelion-worddata,
# digitalsolutiosai/synthellion, digitalsolutiosai/privacyguardml) and are
# fetched on first use (see synthelion/_asset_download.py) instead of being
# bundled, to keep the published wheel under PyPI's size limit. A build that
# wants a fully offline-from-first-install wheel can still populate
# synthelion/worddata/*.br and synthelion/ml_models/ before building — these
# globs pick them up automatically if present.
synthelion = [
    "privacy_rules.yaml",
    "py.typed",
    "plugins/dashboard_assets/*.html",
    "plugins/dashboard_assets/*.css",
    "plugins/dashboard_assets/*.js",
    "plugins/dashboard_assets/vendor/bootstrap/*",
    "plugins/dashboard_assets/vendor/chartjs/*",
    "plugins/dashboard_assets/vendor/echarts/*",
    "plugins/dashboard_assets/img/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
